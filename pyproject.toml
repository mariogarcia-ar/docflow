# Single tooling home for the whole project (`GEN-05`): pytest, ruff, pylint and coverage
# all read their configuration from this file. Do not add a second setup.cfg, tox.ini or
# pylintrc.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow"
version = "0.0.0"
description = "Modular document-processing pipeline: pdf, image, ocr and llm processors under one orchestrator."
requires-python = ">=3.11"
# What `src/` actually imports, which is less than what the development environment installs.
#
# The engines are reached through `importlib` in each processor's `primitives/engine.py` seam, so
# they never appear in a static import statement - they are still hard requirements, because a
# processor whose engine is absent cannot do its job. Pillow is an engine in its own right (IMG-02
# documents it as the drop-in alternative to OpenCV), not an optional extra: `ImageEngineNotAvailableError`
# exists to name a *missing* library, not a library the project never claimed to need.
dependencies = [
    # The array vocabulary every image primitive speaks; `ARRAY_LIBRARY_NAME` in the image seam.
    "numpy>=2.0",
    # `opencv-python-headless`, not `opencv-python`: the standard build links the GUI libs and
    # cannot install on a server without a display, and nothing in this project opens a window
    # (verified: no `imshow`/`waitKey`/`namedWindow` call anywhere in `src/` or `tests/`).
    "opencv-python-headless>=4.10",
    # The second image engine; `PILLOW_ENGINE_NAME` in the seam.
    "Pillow>=10.0",
    # The one and only OCR engine (`subplan-procesador-ocr.md` §3.5: "Docling is the only OCR
    # engine"), reached through `ocr/primitives/engine.py`.
    #
    # A **compatible-release** specifier, not a bare `>=`. `subplan-procesador-ocr.md` §3.6 makes
    # "same engine version ⇒ same logical output structure" the determinism posture, and §8 names
    # "Docling schema changes between versions" as a risk. `>=2.0` would admit 3.0, where that
    # schema may have moved, and the recorded `engine_version` would then be the only clue that a
    # re-run's structure changed for a reason other than its input. `~=2.126.0` pins the minor
    # while still taking patch releases.
    #
    # Docling is a large dependency (it pulls the model stack, and a first run downloads models).
    # That is the price of the processor's whole function, not an optional extra.
    #
    # `# TODO: [RELEASE]` the engine upgrade policy: a deliberate, tested bump with the
    # determinism fixtures re-run, rather than a version that moves when a resolver feels like it.
    "docling~=2.126.0",
]
# Not declared, and deliberately so:
#
# * **Poppler** (`pdftotext`, `pdftoppm`, ...) is the PDF processor's engine, but it is a system
#   binary reached through `subprocess`, not a Python distribution. `pip` cannot install it; the
#   container image is where it belongs, and `PDF-02` records the miss as a typed
#   `PopplerNotAvailableError` rather than a silent substitute.
# * The `llm` engines (Ollama / vLLM / a hosted API): not yet implemented, so not yet
#   dependencies. `tests/test_skeleton.py::ENGINE_MODULES` lists the names the lazy-import rule
#   covers.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "pylint>=3.2.0",
    # Imported directly by `tests/test_packaging.py` to parse the manifest's requirement
    # strings. It arrives transitively with pytest, but the rule this project applies to itself
    # is that a module a file imports is a dependency that file declares.
    "packaging>=23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
# docs/ holds the frozen specification, whose fenced Python blocks are not source: a
# formatter that rewrites a frozen artifact is worse than one that skips it.
exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# `ruff format` owns line length; a long but unsplittable line is not a defect.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = false

# ---------------------------------------------------------------------------------
# Pylint
# ---------------------------------------------------------------------------------
[tool.pylint.main]
py-version = "3.11"
jobs = 0
# docs/ contains the specification, not source.
ignore-paths = ["^docs/"]

[tool.pylint.messages_control]
# `fixme` flags the `# TODO: [MVP]` / `# TODO: [RELEASE]` markers this project requires:
# the markers are the deliverable, not the debt.
disable = ["fixme"]

[tool.pylint.design]
# Contract and durable-state records are wide by design (docs/plan/subplan-*.md §3.1);
# a `PDFPageResult` with twelve named fields is not a defect.
max-attributes = 20
max-args = 20
max-positional-arguments = 20

[tool.pylint.format]
max-line-length = 100

# ---------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Put src/ on the path so `pytest` runs from a clean checkout with no install step.
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
norecursedirs = [".git", ".venv", "docs", "out", "work"]

# ---------------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/docflow"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    # Phase 0 ships typed signatures that raise; a stub line is not a coverage target.
    "raise NotImplementedError",
]
