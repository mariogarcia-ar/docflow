[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow"
version = "0.0.1"
description = "Library-first document extraction: extract structured data from a corpus and expose it for another system to consume."
readme = "README.md"
requires-python = ">=3.13"
# No runtime dependencies yet: Stage 1's boundary layer is pure standard library.
# Each adapter declares its own engine (Docling, Ollama, a provider SDK) when it
# lands — S1-T14, S1-T15, S1-T16.
# TODO: [MVP] Pin the adapter dependencies once the K2-K6 adapters exist, and
# split them into extras (a `[pdf]` extra that pulls poppler bindings, an `[ocr]`
# extra for Docling) so installing the library does not force every engine.
dependencies = []

[project.optional-dependencies]
# The QA gates `.github/copilot-instructions.md` requires. All four are run in CI.
# TODO: [MVP] Add `docflow-kernel` here as a `[dev]` extra so the lab surface is
# not installed with the release package (`kernel-cli.md` §2, §10).
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pylint>=3",
]

# Fixed by `docs/artifacts/kernel-cli.md` §4 — two entry points, two audiences.
# `docflow run` never invokes `docflow-kernel`.
# TODO: [MVP] Both targets land later in Stage 1: `docflow.cli:main` is S1-T18
# and `docflow.kernel_cli:main` is S1-T20. Declaring them here is what fixes the
# names now; running them fails until those modules exist.
[project.scripts]
docflow = "docflow.cli:main"
docflow-kernel = "docflow.kernel_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `pytest` work from a clean checkout with no install, and keeps working once
# the package is installed with `pip install -e .`. Same effect, no step required.
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["docflow"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
# The specification lives in `docs/` and contains Python code blocks. Ruff parses
# fenced code in Markdown, so without this exclusion `ruff format --check .` tries
# to reformat the artifacts — editing a frozen specification as a side effect of
# running the formatter.
extend-exclude = ["docs/"]

[tool.ruff.lint]
# `I` is selected explicitly because the instructions require sorted imports and
# Ruff's default set does not check them. `E`/`F`/`W` are the pyflakes +
# pycodestyle core; `B`, `C4`, `SIM`, `RUF` are the bug-risk and simplification
# families Pylint does not cover.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF"]

ignore = [
    # `ruff format` owns code line length and cannot split a long identifier, so
    # E501 fires on the formatter's own output for long test names. Line length is
    # enforced by the formatter, not by this rule.
    "E501",
    # Deliberately NOT selecting `UP`: its generics rule (UP046) demands PEP 695
    # `class KernelResult[T]`, while `sad.md` §6 freezes the contract as
    # `class KernelResult(Generic[T])`. The frozen artifact wins; the rule is not
    # selected rather than the contract being changed.
]

[tool.pylint.main]
py-version = "3.13"
# `src` first so the package resolves without an install.
source-roots = ["src"]
ignore-paths = ["\\.venv/", "build/", "dist/"]

[tool.pylint.reports]
# A score is noise in a gate that must simply pass or fail.
score = false

[tool.pylint."messages control"]
disable = [
    # `fixme` flags the `# TODO: [MVP]` / `# TODO: [RELEASE]` markers that
    # `.github/copilot-instructions.md` *requires* on every PoC shortcut. The check
    # and the instruction contradict each other, so the check is off: the markers
    # are the deliverable, not the debt.
    "fixme",
    # PoC keeps the package flat; a docstring on every module is a Release concern.
    "missing-module-docstring",
]

[tool.pylint.format]
max-line-length = 88
