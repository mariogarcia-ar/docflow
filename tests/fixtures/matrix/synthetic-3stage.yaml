# descriptors/synthetic-3stage.yaml — Stage 1's closing fixture.
#
# Three stages over a synthetic unit set, and **no domain noun anywhere**: no field,
# no document type, no pipeline code (`kernel-cli.md` §9). That is what makes the
# Stage 1 gate invocable from a shell before any domain component exists, and what
# keeps the lab surface from drifting into the domain layer (§10's forbidden
# vocabulary).
#
# The operations are kernel operations, not pipeline steps. K1 executes this graph
# and does not interpret it: it reads a descriptor, decides what is ready, and hands
# each stage to an operation the composition root bound.
unit: synthetic
units:
  - U-0001
  - U-0002
stages:
  # A root stage: it consumes the unit's own input, so it has no needs. `store put`
  # is the operation that makes a stage's bytes durable, which is what a `done` claim
  # is about.
  - name: acquire
    kernel: store
    op: put
    slot: cpu
    params:
      source: generated

  # The `needs` edge is the barrier: this stage is not dispatched until `acquire` is
  # terminal *and* its artifact still verifies.
  - name: transform
    kernel: pdf
    op: probe
    needs:
      - acquire
    slot: cpu

  - name: persist
    kernel: store
    op: put
    needs:
      - transform
    slot: cpu
